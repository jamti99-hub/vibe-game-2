<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>횡스크롤 플랫폼 게임</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #2b2f3a;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #dfe6f0;
  }
  canvas {
    width: 800px;
    height: 450px;
    max-width: 100vw;
    background: #87ceeb;
    border: 4px solid #1b1e26;
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  p { margin: 12px 0 0; font-size: 14px; opacity: .85; }
  kbd {
    background: #444b5c; border-radius: 4px; padding: 2px 7px;
    border-bottom: 2px solid #1b1e26; font-size: 13px;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<p><kbd>←</kbd> <kbd>→</kbd> 이동 &nbsp;|&nbsp; <kbd>Space</kbd> / <kbd>↑</kbd> 점프 &nbsp;|&nbsp; <kbd>Z</kbd> / <kbd>X</kbd> 공격 &nbsp;|&nbsp; <kbd>R</kbd> 다시 시작 (게임 오버 시)</p>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const FONT = '"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';

  // ---------- 월드 설정 ----------
  const GROUND_H = 60;
  const GROUND_Y = H - GROUND_H;

  // ---------- 물리 상수 (1/60초 기준) ----------
  const GRAVITY    = 0.55;
  const MAX_FALL   = 14;
  const MOVE_ACCEL = 0.6;
  const AIR_ACCEL  = 0.4;
  const MAX_SPEED  = 4.5;
  const FRICTION   = 0.78;
  const JUMP_POWER = -12.5;
  const JUMP_CUT   = 0.45;

  // ---------- 게임 규칙 ----------
  const START_LIVES    = 3;
  const INVULN_FRAMES  = 120;
  const SHOT_COOLDOWN  = 16;
  const SHOT_SPEED     = 8;
  const SHOT_BASE_DROP = 1.3;   // 기본 발사 각도 (아래쪽)
  const SHOT_SPREAD    = 0.85;  // 여러 발일 때 부채꼴 간격
  const MAX_FIRE       = 5;     // 불꽃 최대 단계
  const START_X        = 50;

  // ---------- 스테이지 데이터 (단계마다 새로 생성) ----------
  let platforms = [];
  let hazards = [];
  let worms = [];
  let mosquitoes = [];
  let powerups = [];
  let checkpoints = [];
  const goal = { x: 0, y: GROUND_Y - 130, w: 40, h: 130 };
  let levelW = W;

  // ---------- 카메라 ----------
  let camX = 0;   // 실제 위치 (부드럽게 이동)
  let camR = 0;   // 그릴 때 쓰는 반올림 값

  // ---------- 플레이어 ----------
  const player = {
    x: START_X, y: GROUND_Y - 40,
    w: 28, h: 40,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1,
    walkT: 0
  };

  // ---------- 게임 상태 ----------
  let state = 'playing';   // 'playing' | 'stageclear' | 'gameover'
  let stage = 1;
  let lives = START_LIVES;
  let score = 0;
  let fireLevel = 1;       // 한 번에 발사되는 불꽃 수
  let invuln = 0;
  let shotCd = 0;
  let flash = 0;
  let frame = 0;
  let stageTimer = 0;      // 스테이지 클리어 연출 시간
  let bannerT = 0;         // 스테이지 시작 배너 시간
  let checkpointX = START_X;
  let clearBonus = 0;

  let projectiles = [];
  let particles = [];
  let popups = [];

  // ---------- 시드 난수 (같은 단계는 항상 같은 맵) ----------
  function makeRng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function pickKind(r, n) {
    const table = [
      ['hazard', 3], ['worm', 3], ['platform', 2], ['mosq', 2], ['mixed', Math.min(1 + n, 4)]
    ];
    const total = table.reduce((s, t) => s + t[1], 0);
    let v = r * total;
    for (const [k, wt] of table) {
      v -= wt;
      if (v < 0) return k;
    }
    return 'hazard';
  }

  // ---------- 스테이지 생성: 단계가 오를수록 장애물/적이 늘고 빨라짐 ----------
  function generateStage(n) {
    const rng = makeRng(7919 * n + 13);
    const R  = (a, b) => a + rng() * (b - a);
    const RI = (a, b) => Math.floor(R(a, b + 1));
    const sign = () => (rng() < 0.5 ? -1 : 1);

    platforms = []; hazards = []; worms = []; mosquitoes = [];
    powerups = []; checkpoints = [];

    const wormSpeed = Math.min(0.7 + 0.12 * (n - 1), 1.7);
    const mosqSpeed = Math.min(1.3 + 0.18 * (n - 1), 2.6);

    const addHazard = (hx, hy, size) =>
      hazards.push({ x: hx, y: hy, w: size, h: size, hp: 3, alive: true, hitT: 0 });

    const addWorm = (minX, maxX, surfaceY) =>
      worms.push({
        x: R(minX, maxX - 30), y: surfaceY - 16, w: 30, h: 16,
        vx: sign() * wormSpeed * R(0.85, 1.15),
        minX, maxX, t: RI(0, 40), alive: true
      });

    const addMosquito = (minX, maxX, baseY, amp) =>
      mosquitoes.push({
        x: R(minX, maxX - 26), y: baseY, w: 26, h: 20,
        vx: sign() * mosqSpeed * R(0.85, 1.15),
        minX, maxX, baseY, amp, t: RI(0, 60), alive: true
      });

    const addPower = (px, py) =>
      powerups.push({ x: px, y: py, w: 22, h: 22, taken: false });

    // 발판 3개짜리 구간 (바닥 아래로 지나갈 수 있고, 점프로 오를 수 있는 높이)
    const addPlatformRun = (x0, count, withHazard) => {
      let px = x0 + 40;
      let h = RI(62, 95);
      const made = [];
      for (let k = 0; k < count; k++) {
        const w = RI(100, 150);
        if (k > 0) h = Math.max(62, Math.min(125, h + RI(-30, 45)));
        const p = { x: px, y: GROUND_Y - h, w, h: 20, hz: false };
        platforms.push(p);
        made.push(p);
        if (withHazard && k > 0 && w >= 130 && rng() < Math.min(0.25 + 0.1 * n, 0.65)) {
          addHazard(px + w / 2 - 14, p.y - 28, 28);
          p.hz = true;
        }
        px += w + RI(60, 110);
      }
      return { end: px, made };
    };

    const segCount = 8 + 2 * n;
    let x = 360;   // 시작 구간은 비워 둠

    for (let i = 0; i < segCount; i++) {
      // 4구간마다 휴식 구간: 체크포인트 + 불꽃 파워업
      if (i > 0 && i % 4 === 0) {
        checkpoints.push({ x: x + 60 });
        addPower(x + 180, GROUND_Y - 54);
        x += 280;
      }

      const kind = pickKind(rng(), n);

      if (kind === 'hazard') {
        const c = Math.min(3, 1 + (rng() < 0.3 + 0.12 * n ? 1 : 0) + (n >= 3 && rng() < 0.5 ? 1 : 0));
        for (let j = 0; j < c; j++) {
          const size = (n >= 3 && rng() < 0.4) ? 36 : RI(28, 32);
          addHazard(x + j * 230 + 115 - size / 2, GROUND_Y - size, size);
        }
        x += c * 230;

      } else if (kind === 'worm') {
        const c = Math.min(3, 1 + (n >= 2 && rng() < 0.6 ? 1 : 0) + (n >= 4 ? 1 : 0));
        const zw = 200 + 60 * c;
        for (let j = 0; j < c; j++) addWorm(x, x + zw, GROUND_Y);
        x += zw;

      } else if (kind === 'platform') {
        const run = addPlatformRun(x, 3, true);
        if (rng() < 0.4) {
          const cand = run.made.filter(p => !p.hz);
          if (cand.length) {
            const p = cand[RI(0, cand.length - 1)];
            addPower(p.x + p.w / 2 - 11, p.y - 28);
          }
        }
        x = run.end;

      } else if (kind === 'mosq') {
        const c = Math.min(3, 1 + (n >= 3 ? 1 : 0) + (n >= 5 ? 1 : 0));
        const zw = 300;
        for (let j = 0; j < c; j++) {
          addMosquito(x, x + zw, GROUND_Y - RI(100, 170), RI(18, 28));
        }
        x += zw;

      } else { // 'mixed': 발판 위의 벌레 + 머리 위의 모기
        const run = addPlatformRun(x, 3, false);
        const wp = run.made[1];
        addWorm(wp.x + 3, wp.x + wp.w - 3, wp.y);
        if (n >= 3) {
          const wp2 = run.made[2];
          addWorm(wp2.x + 3, wp2.x + wp2.w - 3, wp2.y);
        }
        addMosquito(x, run.end, GROUND_Y - 210, 18);
        x = run.end;
      }

      x += RI(40, 100);
    }

    x += 200;
    levelW = Math.max(W, x + 120);
    goal.x = levelW - 110;
  }

  // ---------- 스테이지 / 게임 진행 ----------
  function startStage(n) {
    stage = n;
    generateStage(n);
    checkpointX = START_X;
    player.x = START_X;
    player.y = GROUND_Y - player.h;
    player.vx = 0; player.vy = 0;
    player.onGround = false;
    player.facing = 1;
    player.walkT = 0;
    camX = 0;
    projectiles = [];
    particles = [];
    popups = [];
    shotCd = 0;
    invuln = 60;
    bannerT = 130;
    state = 'playing';
  }

  function newGame() {
    lives = START_LIVES;
    score = 0;
    fireLevel = 1;
    flash = 0;
    startStage(1);
  }

  function camTarget() {
    return Math.max(0, Math.min(levelW - W, player.x + player.w / 2 - W * 0.4));
  }

  function respawn() {
    player.x = checkpointX;
    player.y = GROUND_Y - player.h;
    player.vx = 0; player.vy = 0;
    player.onGround = false;
    player.facing = 1;
    player.walkT = 0;
    camX = camTarget();
    projectiles = [];
    invuln = INVULN_FRAMES;
  }

  function loseLife() {
    lives--;
    flash = 20;
    burst(player.x + player.w / 2, player.y + player.h / 2, '#e53935', 14);
    if (lives <= 0) {
      lives = 0;
      state = 'gameover';
    } else {
      respawn();   // 마지막 체크포인트에서 부활
    }
  }

  // 장애물/적에 닿으면: 불꽃 단계 -1, 이미 1단계면 목숨 -1
  function hurtPlayer() {
    if (fireLevel > 1) {
      fireLevel--;
      invuln = INVULN_FRAMES;
      flash = 12;
      player.vy = -6;
      player.vx = -player.facing * 3;
      player.onGround = false;
      burst(player.x + player.w / 2, player.y + player.h / 2, '#ffb300', 10);
      popup(player.x + player.w / 2, player.y - 6, `FIRE Lv.${fireLevel}`, '#ff8a65');
    } else {
      loseLife();
    }
  }

  // ---------- 입력 ----------
  const keys = { left: false, right: false, shoot: false };
  let jumpHeld = false;
  let jumpQueued = false;

  function setKey(e, down) {
    switch (e.code) {
      case 'ArrowLeft':  keys.left = down; break;
      case 'ArrowRight': keys.right = down; break;
      case 'Space':
      case 'ArrowUp':
        if (down && !jumpHeld) jumpQueued = true;
        jumpHeld = down;
        break;
      case 'KeyZ':
      case 'KeyX':
        keys.shoot = down;
        break;
      case 'KeyR':
        if (down && state === 'gameover') newGame();
        return;
      default: return;
    }
    e.preventDefault();
  }
  window.addEventListener('keydown', e => setKey(e, true));
  window.addEventListener('keyup',   e => setKey(e, false));
  window.addEventListener('blur', () => {
    keys.left = keys.right = keys.shoot = false; jumpHeld = false; jumpQueued = false;
  });

  // ---------- 유틸 ----------
  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function inset(r, d) {
    return { x: r.x + d, y: r.y + d, w: r.w - d * 2, h: r.h - d * 2 };
  }
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 20 + Math.random() * 15, color });
    }
  }
  function popup(x, y, text, color) {
    popups.push({ x, y, text, color, life: 50 });
  }
  function nearCam(e) {
    return e.x + e.w > camX - 250 && e.x < camX + W + 250;
  }
  function visible(o) {
    return o.x + o.w > camR - 60 && o.x < camR + W + 60;
  }

  // ---------- 업데이트 ----------
  function update() {
    frame++;
    if (flash > 0) flash--;

    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
    }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 0.6; p.life--; }
    popups = popups.filter(p => p.life > 0);

    if (state === 'stageclear') {
      stageTimer--;
      if (stageTimer <= 0) startStage(stage + 1);
      return;
    }
    if (state !== 'playing') return;

    if (bannerT > 0) bannerT--;
    if (invuln > 0) invuln--;
    if (shotCd > 0) shotCd--;
    for (const h of hazards) if (h.hitT > 0) h.hitT--;

    // 좌우 이동
    const accel = player.onGround ? MOVE_ACCEL : AIR_ACCEL;
    if (keys.left && !keys.right) {
      player.vx -= accel; player.facing = -1;
    } else if (keys.right && !keys.left) {
      player.vx += accel; player.facing = 1;
    } else {
      player.vx *= player.onGround ? FRICTION : 0.95;
      if (Math.abs(player.vx) < 0.05) player.vx = 0;
    }
    player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));

    // 점프 (이단 점프 방지)
    if (jumpQueued && player.onGround) {
      player.vy = JUMP_POWER;
      player.onGround = false;
    }
    jumpQueued = false;
    if (!jumpHeld && player.vy < 0) {
      player.vy += GRAVITY * (1 / JUMP_CUT - 1);
    }
    player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);

    // X축 이동 + 발판 옆면 충돌
    player.x += player.vx;
    for (const p of platforms) {
      if (!nearCam(p)) continue;
      if (overlap(player, p)) {
        if (player.vx > 0) player.x = p.x - player.w;
        else if (player.vx < 0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }
    // 화면 왼쪽으로는 되돌아갈 수 없고, 맵 오른쪽 끝에서 막힘
    if (player.x < camX) { player.x = camX; player.vx = 0; }
    if (player.x + player.w > levelW) { player.x = levelW - player.w; player.vx = 0; }

    // Y축 이동 + 발판 위/아래 충돌
    player.onGround = false;
    player.y += player.vy;
    for (const p of platforms) {
      if (!nearCam(p)) continue;
      if (overlap(player, p)) {
        if (player.vy > 0) {
          player.y = p.y - player.h;
          player.onGround = true;
        } else if (player.vy < 0) {
          player.y = p.y + p.h;
        }
        player.vy = 0;
      }
    }
    if (player.y + player.h >= GROUND_Y) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
    }

    if (player.onGround && Math.abs(player.vx) > 0.3) {
      player.walkT += Math.abs(player.vx) * 0.12;
    } else if (player.onGround) {
      player.walkT = 0;
    }

    // 카메라: 플레이어가 앞으로 가면 화면이 따라 이동 (뒤로는 안 감)
    const target = camTarget();
    if (target > camX) {
      camX += (target - camX) * 0.15;
      if (target - camX < 0.1) camX = target;
    }

    // 체크포인트 통과
    for (const cp of checkpoints) {
      if (player.x > cp.x && cp.x > checkpointX) checkpointX = cp.x;
    }

    // ----- 공격 (Z / X): 불꽃 단계만큼 부채꼴로 동시에 발사 -----
    if (keys.shoot && shotCd === 0) {
      const n = fireLevel;
      for (let i = 0; i < n; i++) {
        projectiles.push({
          x: player.facing > 0 ? player.x + player.w : player.x - 12,
          y: player.y + 18,
          w: 12, h: 8,
          vx: SHOT_SPEED * player.facing,
          vy: SHOT_BASE_DROP + (i - (n - 1) / 2) * SHOT_SPREAD
        });
      }
      shotCd = SHOT_COOLDOWN;
    }

    // ----- 적 이동 (화면 근처에서만 활동) -----
    for (const w of worms) {
      if (!w.alive || !nearCam(w)) continue;
      w.x += w.vx; w.t++;
      if (w.x < w.minX) { w.x = w.minX; w.vx = Math.abs(w.vx); }
      if (w.x + w.w > w.maxX) { w.x = w.maxX - w.w; w.vx = -Math.abs(w.vx); }
    }
    for (const m of mosquitoes) {
      if (!m.alive || !nearCam(m)) continue;
      m.x += m.vx; m.t++;
      if (m.x < m.minX) { m.x = m.minX; m.vx = Math.abs(m.vx); }
      if (m.x + m.w > m.maxX) { m.x = m.maxX - m.w; m.vx = -Math.abs(m.vx); }
      m.y = m.baseY + Math.sin(m.t * 0.08) * m.amp;
    }

    // ----- 투사체 -----
    for (const s of projectiles) {
      s.x += s.vx;
      s.y += s.vy;
      let hit = false;

      if (s.x + s.w < camX - 40 || s.x > camX + W + 40 || s.y > H) { s.dead = true; continue; }

      for (const p of platforms) {
        if (nearCam(p) && overlap(s, p)) { hit = true; break; }
      }
      if (!hit) for (const h of hazards) {
        if (h.alive && overlap(s, h)) {
          hit = true;
          h.hp--;
          h.hitT = 8;
          if (h.hp <= 0) {
            h.alive = false;
            score += 30;
            burst(h.x + h.w / 2, h.y + h.h / 2, '#e53935', 16);
            popup(h.x + h.w / 2, h.y - 4, '+30', '#fff59d');
          }
          break;
        }
      }
      if (!hit) for (const w of worms) {
        if (w.alive && overlap(s, w)) {
          w.alive = false; score += 100; hit = true;
          burst(w.x + w.w / 2, w.y + w.h / 2, '#8bc34a', 12);
          popup(w.x + w.w / 2, w.y - 4, '+100', '#fff59d');
          break;
        }
      }
      if (!hit) for (const m of mosquitoes) {
        if (m.alive && overlap(s, m)) {
          m.alive = false; score += 150; hit = true;
          burst(m.x + m.w / 2, m.y + m.h / 2, '#9e9e9e', 12);
          popup(m.x + m.w / 2, m.y - 4, '+150', '#fff59d');
          break;
        }
      }
      if (!hit && s.y + s.h >= GROUND_Y) hit = true;
      if (hit) {
        s.dead = true;
        burst(s.x + s.w / 2, s.y + s.h / 2, '#ffb300', 5);
      }
    }
    projectiles = projectiles.filter(s => !s.dead);

    // ----- 파워업 획득: 불꽃 단계 +1 -----
    for (const pu of powerups) {
      if (pu.taken || !overlap(player, pu)) continue;
      pu.taken = true;
      score += 50;
      if (fireLevel < MAX_FIRE) {
        fireLevel++;
        popup(pu.x + 11, pu.y - 6, `FIRE Lv.${fireLevel}!`, '#ffee58');
      } else {
        popup(pu.x + 11, pu.y - 6, 'MAX!', '#ffee58');
      }
      burst(pu.x + 11, pu.y + 11, '#ffd54f', 14);
    }

    // ----- 피격 (장애물 / 적) -----
    if (invuln === 0) {
      const body = inset(player, 3);
      let hurt = false;
      for (const h of hazards) {
        if (h.alive && nearCam(h) && overlap(body, inset(h, 3))) { hurt = true; break; }
      }
      if (!hurt) for (const w of worms) {
        if (w.alive && nearCam(w) && overlap(body, inset(w, 2))) { hurt = true; break; }
      }
      if (!hurt) for (const m of mosquitoes) {
        if (m.alive && nearCam(m) && overlap(body, inset(m, 3))) { hurt = true; break; }
      }
      if (hurt) { hurtPlayer(); return; }
    }

    // ----- 목적지 도달 → 스테이지 클리어 -----
    if (overlap(player, goal)) {
      clearBonus = 500 + 100 * (stage - 1);
      score += clearBonus;
      state = 'stageclear';
      stageTimer = 170;
      player.vx = 0;
      burst(goal.x + 20, goal.y + 30, '#ffeb3b', 24);
    }
  }

  // ---------- 그리기 ----------
  const clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({ x: i * 135 + (i % 3) * 20, y: 95 + ((i * 37) % 70), s: 0.8 + (i % 3) * 0.25 });
  }
  const CLOUD_WRAP = 1100;

  function drawCloudAt(x, y, s) {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x,          y,          22 * s, 0, Math.PI * 2);
    ctx.arc(x + 26 * s, y - 10 * s, 28 * s, 0, Math.PI * 2);
    ctx.arc(x + 55 * s, y,          22 * s, 0, Math.PI * 2);
    ctx.fillRect(x, y, 55 * s, 22 * s);
    ctx.fill();
  }

  function drawBackground() {
    ctx.fillStyle = '#87ceeb';
    ctx.fillRect(0, 0, W, H);

    // 구름 (느리게 따라오는 시차 효과)
    for (const c of clouds) {
      const sx = ((((c.x - camX * 0.35) % CLOUD_WRAP) + CLOUD_WRAP) % CLOUD_WRAP) - 150;
      drawCloudAt(sx, c.y, c.s);
    }

    // 먼 언덕
    const period = 500;
    const off = camX * 0.2;
    const base = Math.floor(off / period);
    ctx.fillStyle = '#9ad48a';
    for (let k = -1; k < 4; k++) {
      const idx = base + k;
      const hx = idx * period - off + 120;
      const hh = 70 + (((idx % 2) + 2) % 2) * 25;
      ctx.beginPath();
      ctx.ellipse(hx, GROUND_Y, 150, hh, 0, Math.PI, 0);
      ctx.fill();
    }
  }

  function drawGround() {
    const x0 = camR - 2, w = W + 4;
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(x0, GROUND_Y, w, GROUND_H);
    ctx.fillStyle = '#7a4d22';
    const start = Math.floor(camR / 40) * 40;
    for (let x = start; x < camR + W + 40; x += 40) {
      ctx.fillRect(x + 8,  GROUND_Y + 28, 14, 8);
      ctx.fillRect(x + 24, GROUND_Y + 44, 10, 6);
    }
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(x0, GROUND_Y, w, 14);
    ctx.fillStyle = '#3d9142';
    ctx.fillRect(x0, GROUND_Y + 14, w, 3);
  }

  function drawPlatforms() {
    for (const p of platforms) {
      if (!visible(p)) continue;
      ctx.fillStyle = '#a9743f';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#4caf50';
      ctx.fillRect(p.x, p.y, p.w, 6);
      ctx.fillStyle = '#7a4d22';
      ctx.fillRect(p.x, p.y + 13, p.w, 2);
      for (let x = p.x + 20; x < p.x + p.w; x += 28) ctx.fillRect(x, p.y + 6, 2, 7);
      for (let x = p.x + 6;  x < p.x + p.w; x += 28) ctx.fillRect(x, p.y + 15, 2, 5);
      ctx.strokeStyle = '#5c3a18';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2);
    }
  }

  function drawHazards() {
    for (const h of hazards) {
      if (!h.alive || !visible(h)) continue;
      const hurtFlash = h.hitT > 0;
      ctx.fillStyle = hurtFlash ? '#ffcdd2' : '#e53935';
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.fillStyle = hurtFlash ? '#ffffff' : '#ff6f60';
      ctx.fillRect(h.x + 3, h.y + 3, h.w - 6, 4);
      ctx.strokeStyle = '#7f1010';
      ctx.lineWidth = 3;
      ctx.strokeRect(h.x + 1.5, h.y + 1.5, h.w - 3, h.h - 3);
      ctx.lineWidth = 2;
      if (h.hp <= 2) {
        ctx.beginPath();
        ctx.moveTo(h.x + h.w * 0.3, h.y + 2);
        ctx.lineTo(h.x + h.w * 0.45, h.y + h.h * 0.5);
        ctx.lineTo(h.x + h.w * 0.3, h.y + h.h - 2);
        ctx.stroke();
      }
      if (h.hp <= 1) {
        ctx.beginPath();
        ctx.moveTo(h.x + h.w - 2, h.y + h.h * 0.25);
        ctx.lineTo(h.x + h.w * 0.55, h.y + h.h * 0.55);
        ctx.lineTo(h.x + h.w * 0.75, h.y + h.h - 2);
        ctx.stroke();
      }
    }
  }

  function starPath(cx, cy, r1, r2) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const r = i % 2 ? r2 : r1;
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    ctx.closePath();
  }

  function drawPowerups() {
    for (const p of powerups) {
      if (p.taken || !visible(p)) continue;
      const cx = p.x + 11;
      const cy = p.y + 11 + Math.sin(frame * 0.1 + p.x * 0.01) * 3;
      ctx.fillStyle = `rgba(255, 213, 79, ${0.25 + 0.15 * Math.sin(frame * 0.12)})`;
      ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff7043';
      ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#bf360c';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#fff59d';
      starPath(cx, cy, 7, 3);
      ctx.fill();
    }
  }

  function drawCheckpoints() {
    for (const cp of checkpoints) {
      if (!visible({ x: cp.x, w: 30 })) continue;
      const reached = cp.x <= checkpointX;
      ctx.fillStyle = '#9e9e9e';
      ctx.fillRect(cp.x, GROUND_Y - 46, 4, 46);
      ctx.fillStyle = reached ? '#43a047' : '#bdbdbd';
      ctx.beginPath();
      ctx.moveTo(cp.x + 4, GROUND_Y - 46);
      ctx.lineTo(cp.x + 26, GROUND_Y - 38);
      ctx.lineTo(cp.x + 4, GROUND_Y - 28);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawGoal() {
    const poleX = goal.x + 6;
    const topY = goal.y;
    ctx.fillStyle = '#9e9e9e';
    ctx.fillRect(poleX, topY, 5, goal.h);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(poleX + 2.5, topY - 2, 6, 0, Math.PI * 2);
    ctx.fill();
    const wave = Math.sin(frame * 0.12) * 3;
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.moveTo(poleX + 5, topY + 6);
    ctx.lineTo(poleX + 34, topY + 20 + wave);
    ctx.lineTo(poleX + 5, topY + 36);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#c9a800';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#6d6d6d';
    ctx.fillRect(poleX - 8, GROUND_Y - 8, 21, 8);
  }

  function drawWorm(w) {
    const dir = w.vx >= 0 ? 1 : -1;
    const segs = 4;
    const r = 6;
    for (let i = 0; i < segs; i++) {
      const frac = i / (segs - 1);
      const cx = dir > 0 ? w.x + 7 + frac * (w.w - 14) : w.x + w.w - 7 - frac * (w.w - 14);
      const bump = Math.sin(w.t * 0.3 - i * 0.9) * 2.2;
      const cy = w.y + w.h - r - 1 - Math.max(0, bump);
      ctx.fillStyle = i === segs - 1 ? '#aed581' : (i % 2 ? '#7cb342' : '#8bc34a');
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#4e7a1f';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      if (i === segs - 1) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx + dir * 2, cy - 2, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.arc(cx + dir * 2.6, cy - 2, 1.1, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#4e7a1f';
        ctx.beginPath();
        ctx.moveTo(cx + dir * 2, cy - r + 1);
        ctx.lineTo(cx + dir * 6, cy - r - 5);
        ctx.stroke();
      }
    }
  }

  function drawMosquito(m) {
    const dir = m.vx >= 0 ? 1 : -1;
    const cx = m.x + m.w / 2, cy = m.y + m.h / 2;
    const flap = Math.sin(m.t * 1.4);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(dir, 1);

    ctx.fillStyle = 'rgba(220, 235, 255, 0.75)';
    ctx.strokeStyle = 'rgba(120, 150, 190, 0.9)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(-4, -7, 9, 4 + flap * 2.5, -0.5 - flap * 0.35, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(1, -8, 8, 3 + flap * 2, -0.2 - flap * 0.3, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-3, 3); ctx.lineTo(-7, 9);
    ctx.moveTo(0, 4);  ctx.lineTo(-1, 10);
    ctx.moveTo(3, 3);  ctx.lineTo(5, 9);
    ctx.stroke();

    ctx.fillStyle = '#455a64';
    ctx.beginPath(); ctx.ellipse(-5, 1, 8, 4, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#607d8b';
    ctx.beginPath(); ctx.ellipse(4, 0, 5, 4, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#e53935';
    ctx.beginPath(); ctx.arc(6, -1, 1.8, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(8, 1); ctx.lineTo(15, 4); ctx.stroke();

    ctx.restore();
  }

  function drawProjectiles() {
    for (const s of projectiles) {
      const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.fillStyle = 'rgba(255, 179, 0, 0.35)';
      ctx.fillRect(-s.w / 2 - 8, -s.h / 2 + 1, 8, s.h - 2);
      ctx.fillStyle = '#ff7043';
      ctx.beginPath(); ctx.ellipse(0, 0, s.w / 2, s.h / 2 + 1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffee58';
      ctx.beginPath(); ctx.ellipse(0, 0, s.w / 4, s.h / 4 + 1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 20));
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold 16px ${FONT}`;
    ctx.lineWidth = 4;
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 20));
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    const p = player;
    const px = Math.round(p.x), py = Math.round(p.y);

    // 그림자
    let surfaceY = GROUND_Y;
    for (const pl of platforms) {
      if (p.x + p.w > pl.x && p.x < pl.x + pl.w &&
          pl.y >= p.y + p.h - 1 && pl.y < surfaceY) {
        surfaceY = pl.y;
      }
    }
    const heightAbove = Math.max(0, surfaceY - (p.y + p.h));
    const shadowScale = Math.max(0.35, 1 - heightAbove / 200);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(p.x + p.w / 2, surfaceY + 3, 16 * shadowScale, 4 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    // 무적 시간에는 깜빡임
    if (invuln > 0 && Math.floor(invuln / 5) % 2 === 0) return;

    ctx.save();
    ctx.translate(px + p.w / 2, py);
    ctx.scale(p.facing, 1);
    ctx.translate(-p.w / 2, 0);

    const step = p.onGround ? Math.sin(p.walkT) * 4 : 0;
    const air = !p.onGround;

    ctx.fillStyle = '#5b3a1e';
    if (air) {
      ctx.fillRect(3,  34, 10, 6);
      ctx.fillRect(15, 32, 10, 8);
    } else {
      ctx.fillRect(3  + step, 34, 10, 6);
      ctx.fillRect(15 - step, 34, 10, 6);
    }

    ctx.fillStyle = '#1e56d6';
    ctx.fillRect(4, 22, 20, 14);
    ctx.fillStyle = '#e53935';
    ctx.fillRect(2, 18, 24, 8);
    const attacking = shotCd > SHOT_COOLDOWN - 8;
    if (attacking) ctx.fillRect(22, 18, 10, 6);
    else ctx.fillRect(air ? 22 : 22 + step * 0.5, air ? 12 : 20, 6, 8);

    ctx.fillStyle = '#ffd54f';
    ctx.fillRect(7, 25, 3, 3);
    ctx.fillRect(18, 25, 3, 3);

    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(4, 6, 20, 14);
    ctx.fillRect(22, 11, 4, 5);
    ctx.fillStyle = '#4a2c12';
    ctx.fillRect(8, 15, 14, 3);
    ctx.fillStyle = '#222';
    ctx.fillRect(16, 8, 3, 5);

    ctx.fillStyle = '#e53935';
    ctx.fillRect(3, 0, 20, 8);
    ctx.fillRect(3, 6, 26, 4);

    ctx.restore();
  }

  // ---------- UI ----------
  function drawHeart(x, y, size, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.3);
    ctx.bezierCurveTo(x, y, x - size * 0.5, y, x - size * 0.5, y + size * 0.3);
    ctx.bezierCurveTo(x - size * 0.5, y + size * 0.6, x, y + size * 0.8, x, y + size);
    ctx.bezierCurveTo(x, y + size * 0.8, x + size * 0.5, y + size * 0.6, x + size * 0.5, y + size * 0.3);
    ctx.bezierCurveTo(x + size * 0.5, y, x, y, x, y + size * 0.3);
    ctx.fill();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(20, 25, 40, 0.62)';
    ctx.fillRect(0, 0, W, 52);

    // 진행도 바
    const ratio = Math.max(0, Math.min(1, player.x / (levelW - 100)));
    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.fillRect(0, 49, W, 3);
    ctx.fillStyle = '#ffd54f';
    ctx.fillRect(0, 49, W * ratio, 3);

    ctx.textBaseline = 'middle';

    // Life
    ctx.textAlign = 'left';
    ctx.font = `bold 20px ${FONT}`;
    ctx.fillStyle = '#ffffff';
    const label = `Life: ${lives}`;
    ctx.fillText(label, 16, 18);
    const lw = ctx.measureText(label).width;
    for (let i = 0; i < START_LIVES; i++) {
      drawHeart(16 + lw + 20 + i * 22, 9, 16, i < lives ? '#ff5252' : 'rgba(255,255,255,0.25)');
    }

    // Stage
    ctx.textAlign = 'center';
    ctx.font = `bold 20px ${FONT}`;
    ctx.fillStyle = '#b3e5fc';
    ctx.fillText(`STAGE ${stage}`, W / 2, 18);

    // Score
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffeb3b';
    ctx.fillText(`Score: ${score}`, W - 16, 18);

    // 불꽃 단계
    ctx.textAlign = 'left';
    ctx.font = `bold 14px ${FONT}`;
    ctx.fillStyle = '#ffab91';
    const fl = `Fire Lv.${fireLevel}`;
    ctx.fillText(fl, 16, 38);
    const fw = ctx.measureText(fl).width;
    for (let i = 0; i < MAX_FIRE; i++) {
      ctx.fillStyle = i < fireLevel ? '#ff7043' : 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.arc(16 + fw + 14 + i * 11, 38, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // 조작법
    ctx.textAlign = 'center';
    ctx.font = `14px ${FONT}`;
    ctx.fillStyle = '#cfd8e6';
    ctx.fillText('이동: 방향키   |   점프: 스페이스바   |   공격: Z', W / 2 + 40, 38);
  }

  function drawBanner() {
    if (bannerT <= 0 || state !== 'playing') return;
    const alpha = Math.min(1, bannerT / 40);
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold 54px ${FONT}`;
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(20, 40, 80, 0.8)';
    ctx.strokeText(`STAGE ${stage}`, W / 2, 140);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`STAGE ${stage}`, W / 2, 140);
    if (stage >= 2) {
      ctx.font = `bold 20px ${FONT}`;
      ctx.lineWidth = 5;
      ctx.strokeText('장애물이 늘어났습니다!', W / 2, 184);
      ctx.fillStyle = '#ffcdd2';
      ctx.fillText('장애물이 늘어났습니다!', W / 2, 184);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(title, titleColor, strokeColor, lines) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = `bold 58px ${FONT}`;
    ctx.lineWidth = 8;
    ctx.strokeStyle = strokeColor;
    ctx.strokeText(title, W / 2, H / 2 - 40);
    ctx.fillStyle = titleColor;
    ctx.fillText(title, W / 2, H / 2 - 40);

    ctx.font = `bold 26px ${FONT}`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(lines[0], W / 2, H / 2 + 22);

    ctx.font = `18px ${FONT}`;
    ctx.fillStyle = '#e0e6f0';
    ctx.fillText(lines[1], W / 2, H / 2 + 62);
  }

  function render() {
    camR = Math.round(camX);

    drawBackground();

    ctx.save();
    ctx.translate(-camR, 0);
    drawGround();
    drawCheckpoints();
    drawPlatforms();
    drawHazards();
    drawPowerups();
    drawGoal();
    for (const w of worms) if (w.alive && visible(w)) drawWorm(w);
    for (const m of mosquitoes) if (m.alive && visible(m)) drawMosquito(m);
    if (state !== 'gameover') drawPlayer();
    drawProjectiles();
    drawParticles();
    drawPopups();
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(229, 57, 53, ${flash / 20 * 0.45})`;
      ctx.fillRect(0, 0, W, H);
    }

    drawHUD();
    drawBanner();

    if (state === 'stageclear') {
      drawOverlay(
        `Stage ${stage} Clear!`, '#ffeb3b', '#b8860b',
        [`보너스 +${clearBonus}   Score: ${score}`, `잠시 후 STAGE ${stage + 1} 이 시작됩니다...`]
      );
    } else if (state === 'gameover') {
      drawOverlay(
        'Game Over', '#ff5252', '#7f1010',
        [`STAGE ${stage}   Score: ${score}`, 'R 키를 누르면 처음부터 다시 시작합니다.']
      );
    }
  }

  // ---------- 고정 시간 간격 루프 ----------
  const STEP = 1000 / 60;
  let last = performance.now();
  let acc = 0;

  function loop(now) {
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= STEP) {
      update();
      acc -= STEP;
    }
    render();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
